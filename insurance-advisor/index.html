<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保險配置建議工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --surface:#fcfcfb; --white:#fff; --ink:#141414; --ink2:#52514e; --muted:#8a8984;
  --line:#e3e1db; --line2:#d3d0c8; --soft:#efeee9;
  --crimson:#9b1c25; --crimson-soft:#f7ecec;
  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;
  --font:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance} p{text-wrap:pretty}
.app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 6px}
.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .eyebrow{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600}
.top select{border:1px solid var(--line2);background:var(--white);border-radius:8px;padding:7px 10px;font-size:13.5px}
.label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* input */
.input-card{padding:0;overflow:hidden}
textarea#story{display:block;width:100%;min-height:118px;border:0;resize:vertical;padding:14px 16px 6px;font-size:16px;line-height:1.65;background:var(--white);outline:none}
.input-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.mic{display:flex;align-items:center;gap:8px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px 9px 14px;font-size:15px;font-weight:600;cursor:pointer;min-height:44px}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--crimson)}
.mic.on rect{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}
.ghost{border:1px solid var(--line2);background:var(--white);border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;min-height:40px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 4px 0}
.parsed{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pchip{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--ink);color:#fff}
.pchip.miss{background:transparent;color:var(--ink2);border:1px dashed var(--line2)}
.miss-lab{font-size:12.5px;color:var(--ink2);width:100%;margin-top:4px}

/* quick controls */
.qrow + .qrow{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:13.5px;font-weight:600}
.qhead .val{font-size:20px;font-weight:700}
.qhead .val small{font-size:12.5px;color:var(--ink2);font-weight:500;margin-left:2px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.range-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:4px 0;font-size:12.5px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:var(--white);min-height:42px}
.seg label{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border-right:1px solid var(--line);color:var(--ink2);margin:0;text-align:center;padding:0 4px}
.seg label:last-child{border-right:0}
.seg input{display:none}
.seg label:has(input:checked){background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;background:var(--white);color:var(--ink2);user-select:none;min-height:36px;display:inline-flex;align-items:center}
.chip input{display:none}
.chip:has(input:checked){background:var(--ink);border-color:var(--ink);color:#fff}

/* details form */
details.more{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.more>summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;display:flex;justify-content:space-between}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"＋";color:var(--muted);font-weight:400}
details.more[open]>summary::after{content:"－"}
.more-body{padding:0 16px 16px}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 8px}
.grp:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--white);font-size:16px;min-height:42px}
.unit{position:relative}.unit input{padding-right:40px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted);pointer-events:none}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--ink)}

/* hero */
.hero{margin-top:26px;padding-top:18px;border-top:2px solid var(--ink)}
.hero .who{font-size:13.5px;color:var(--ink2)}
.hero .big{display:flex;align-items:baseline;gap:8px;margin:4px 0 12px}
.hero .big b{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .big span{font-size:14px;color:var(--ink2)}
.stack{display:flex;gap:2px;height:16px;border-radius:5px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%;cursor:pointer;transition:opacity .15s}
.stack.dim i{opacity:.3}.stack.dim i.on{opacity:1}
.stack-cap{font-size:13px;color:var(--ink2);margin-top:8px;min-height:20px}
.stack-cap b{color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--ink2)}
.mini b{display:flex;align-items:center;gap:6px;font-size:17px;color:var(--ink);margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

/* tabs */
.tabs{position:sticky;top:0;z-index:15;background:rgba(244,243,239,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin:18px -16px 12px;padding:8px 16px;border-bottom:1px solid var(--line);display:flex;gap:4px}
.tabs button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--ink2);cursor:pointer;position:relative;min-height:40px}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button .bdg{position:absolute;top:6px;right:calc(50% - 22px);width:7px;height:7px;border-radius:50%;background:var(--crimson)}
.panel{display:none}.panel.on{display:block}

/* product rows */
.prow{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.prow.off{background:var(--bg)}
.prow.off .ph{opacity:.5}
.ph{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.ph .main{flex:1;min-width:0}
.ph .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px}
.ph .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.ph .amt{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.ph .amt b{display:block;font-size:16px;color:var(--ink)}
.tgl{position:relative;width:44px;height:26px;flex:none}
.tgl input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:2}
.tgl span{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:background .15s}
.tgl span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.tgl input:checked+span{background:var(--ink)}
.tgl input:checked+span::after{transform:translateX(18px)}
.pbody{display:none;padding:0 14px 13px 14px;font-size:13.5px;color:var(--ink2)}
.prow.open .pbody{display:block}
.pbody p{margin:0}
.chev{width:16px;height:16px;flex:none;color:var(--muted);transition:transform .15s}
.prow.open .chev{transform:rotate(180deg)}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;font-weight:600;white-space:nowrap}
.tag.p1{background:var(--ink);color:#fff}.tag.p2{background:var(--soft);color:var(--ink)}.tag.p3{border:1px solid var(--line2);color:var(--ink2)}.tag.def{border:1px dashed var(--muted);color:var(--ink2)}
.svc-line{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:8px}
.svc-line svg{flex:none;width:16px;height:16px;margin-top:2px;stroke:var(--crimson)}
.svc-line b{color:var(--ink)}
.note-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink2);background:var(--surface);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.note-row b{color:var(--ink)}
.warn{font-size:13px;background:#fff8e6;border:1px solid #f3dfa6;border-radius:10px;padding:9px 12px;margin-bottom:10px}

/* gaps */
.gap-row{padding:10px 0;border-top:1px solid var(--line)}
.gap-row:first-child{border-top:0;padding-top:0}
.gap-row .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:6px}
.gap-row .t span{color:var(--ink2);font-size:12.5px}
.track{height:10px;background:var(--soft);border-radius:4px;display:flex;overflow:hidden;gap:2px}
.track i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}

/* projection */
.scen{margin-bottom:10px}
.svgbox{position:relative;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.5;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5;transform:translate(-50%,-100%)}
.tip .r{display:flex;justify-content:space-between;gap:12px}
.ln{width:16px;height:2px;display:inline-block}
.proj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.proj-stats div{border-top:1px solid var(--line);padding-top:8px;font-size:12px;color:var(--ink2)}
.proj-stats b{display:block;font-size:16px;color:var(--ink)}

/* service */
.q{font-size:15px;font-weight:700;margin:0 0 4px}
.qsub{font-size:13.5px;color:var(--ink2);margin:0 0 12px}
.seg.crim label:has(input:checked){background:var(--crimson)}
.state{font-size:13px;color:var(--ink2);margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.ins{border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0}
.ins-h{display:grid;grid-template-columns:1fr repeat(4,30px) 16px;gap:4px;align-items:center;padding:11px 0;cursor:pointer}
.ins-h .co{font-weight:700;font-size:14.5px}
.ins-h .co small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.mk{width:30px;text-align:center;font-size:13px}
.mk.y{color:var(--ink)}.mk.n{color:var(--line2)}
.ins-head{display:grid;grid-template-columns:1fr repeat(4,30px) 16px;gap:4px;font-size:10.5px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line);line-height:1.25}
.ins-head span{text-align:center}
.ins.fit .ins-h .co{color:var(--crimson)}
.ins-b{display:none;font-size:13px;color:var(--ink2);padding:0 0 12px}
.ins.open .ins-b{display:block}
.ins.open .chev{transform:rotate(180deg)}
.fitbar{font-size:12px;color:var(--ink2);margin:12px 0 2px}
.foot{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.6}
.phone{background:#eef1f4;border-radius:16px;border:1px solid var(--line2);overflow:hidden;margin-top:10px}
.phone-h{background:var(--white);padding:9px 13px;border-bottom:1px solid var(--line);font-size:12.5px}
.phone-h b{font-size:13px}
.chat{padding:11px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.5}
.msg.u{align-self:flex-end;background:#d9f2c9;border-bottom-right-radius:4px;color:var(--ink)}
.msg.b{align-self:flex-start;background:var(--white);border-bottom-left-radius:4px;border:1px solid var(--line);color:var(--ink)}
.crit{padding:12px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.crit b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

pre.summary{white-space:pre-wrap;font-family:var(--font);font-size:13.5px;margin:0;line-height:1.75}
footer{font-size:11.5px;color:var(--muted);line-height:1.7;margin:22px 2px 0}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(252,252,251,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom))}
.actions .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.actions .sum{flex:1;font-size:12.5px;color:var(--ink2);line-height:1.35}
.actions .sum b{display:block;font-size:16px;color:var(--ink)}
.btn{border:1px solid var(--line2);background:var(--white);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}

.label-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.label-row select{border:1px solid var(--line2);background:var(--white);border-radius:8px;padding:6px 8px;font-size:13px;margin-bottom:6px;max-width:48%}
.seg.lang{min-height:34px;width:96px;flex:none}
.seg.lang label{font-size:13px;font-weight:600}
.ins-h,.ins-head{grid-template-columns:1fr repeat(4,34px) 16px}
.mk{width:34px}
html[lang=en] .tabs button{font-size:13.5px}
html[lang=en] .hero .big b{font-size:34px}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="eyebrow">BROKER ADVISORY</div><h1 data-i="title"></h1></div>
    <div class="seg lang" id="langSeg"><label><input type="radio" name="lang" value="zh"><span>中</span></label><label><input type="radio" name="lang" value="en"><span>EN</span></label></div>
  </div>

  <div class="label-row"><div class="label" data-i="labInput"></div>
    <select id="preset"><option value="" data-i="preset"></option><option value="family" data-i="pFamily"></option><option value="single" data-i="pSingle"></option><option value="dink" data-i="pDink"></option><option value="hnw" data-i="pHnw"></option></select>
  </div>
  <div class="card input-card">
    <textarea id="story" data-iph="phStory"></textarea>
    <div class="input-tools">
      <button class="mic" id="mic" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="micLabel"></span></button>
      <button class="ghost" id="clearStory" type="button" data-i="clear"></button>
    </div>
  </div>
  <div class="hint" id="micHint" data-i="hintMic"></div>
  <div class="parsed" id="parsed"></div>

  <div class="label" data-i="labQuick"></div>
  <div class="card" id="quick">
    <div class="qrow">
      <div class="qhead"><span data-i="budget"></span><span class="val num" id="budgetVal"></span></div>
      <input type="range" id="budgetR" min="0" max="60" step="0.5">
      <div class="range-foot"><span id="budgetNote"></span><button class="linkbtn" id="budgetAuto" type="button" data-i="useSuggested"></button></div>
    </div>
    <div class="qrow">
      <div class="qhead"><span data-i="risk"></span></div>
      <div class="seg"><label><input type="radio" name="risk" value="c"><span data-i="rc"></span></label><label><input type="radio" name="risk" value="m"><span data-i="rm"></span></label><label><input type="radio" name="risk" value="a"><span data-i="ra"></span></label></div>
    </div>
    <div class="qrow">
      <div class="qhead"><span data-i="goals"></span></div>
      <div class="chips">
        <label class="chip"><input type="checkbox" name="goal" value="family"><span data-i="gFamily"></span></label>
        <label class="chip"><input type="checkbox" name="goal" value="medical"><span data-i="gMedical"></span></label>
        <label class="chip"><input type="checkbox" name="goal" value="retire"><span data-i="gRetire"></span></label>
        <label class="chip"><input type="checkbox" name="goal" value="edu"><span data-i="gEdu"></span></label>
        <label class="chip"><input type="checkbox" name="goal" value="legacy"><span data-i="gLegacy"></span></label>
        <label class="chip"><input type="checkbox" name="goal" value="save"><span data-i="gSave"></span></label>
      </div>
    </div>
  </div>

  <details class="more">
    <summary data-i="more"></summary>
    <div class="more-body">
      <div class="hint" style="margin:0 0 10px" data-i="unitNote"></div>
      <form id="f" onsubmit="return false">
        <div class="grp" data-i="grpBasic"></div>
        <div class="grid2">
          <div class="field" style="grid-column:1/-1"><label for="name" data-i="fName"></label><input type="text" id="name"></div>
          <div class="field"><label for="age" data-i="fAge"></label><div class="unit"><input type="number" inputmode="numeric" id="age"><span data-i="uYr"></span></div></div>
          <div class="field"><label data-i="fSex"></label><div class="seg"><label><input type="radio" name="sex" value="M"><span data-i="sM"></span></label><label><input type="radio" name="sex" value="F"><span data-i="sF"></span></label></div></div>
          <div class="field"><label for="marital" data-i="fMarital"></label><select id="marital"><option value="single" data-i="mSingle"></option><option value="married" data-i="mMarried"></option><option value="divorced" data-i="mDivorced"></option></select></div>
          <div class="field"><label for="job" data-i="fJob"></label><select id="job"><option value="1" data-i="j1"></option><option value="2" data-i="j2"></option><option value="3" data-i="j3"></option></select></div>
          <div class="field"><label for="kids" data-i="fKids"></label><div class="unit"><input type="number" inputmode="numeric" id="kids"><span data-i="uKid"></span></div></div>
          <div class="field"><label for="youngest" data-i="fYoungest"></label><div class="unit"><input type="number" inputmode="numeric" id="youngest"><span data-i="uYr"></span></div></div>
        </div>
        <div class="grp" data-i="grpFin"></div>
        <div class="grid2">
          <div class="field"><label for="income" data-i="fIncome"></label><div class="unit"><input type="number" inputmode="decimal" id="income"><span data-i="uWan"></span></div></div>
          <div class="field"><label for="exp" data-i="fExp"></label><div class="unit"><input type="number" inputmode="decimal" id="exp" step="0.5"><span data-i="uWan"></span></div></div>
          <div class="field"><label for="debt" data-i="fDebt"></label><div class="unit"><input type="number" inputmode="decimal" id="debt"><span data-i="uWan"></span></div></div>
          <div class="field"><label for="assets" data-i="fAssets"></label><div class="unit"><input type="number" inputmode="decimal" id="assets"><span data-i="uWan"></span></div></div>
          <div class="field"><label for="lifeHave" data-i="fLifeHave"></label><div class="unit"><input type="number" inputmode="decimal" id="lifeHave"><span data-i="uWan"></span></div></div>
          <div class="field"><label for="retire" data-i="fRetire"></label><div class="unit"><input type="number" inputmode="numeric" id="retire"><span data-i="uYr"></span></div></div>
        </div>
        <div class="grp" data-i="grpHave"></div>
        <label class="check"><input type="checkbox" id="hasMed"><span data-i="hasMed"></span></label>
        <label class="check"><input type="checkbox" id="hasCI"><span data-i="hasCI"></span></label>

const DEFAULTS = {name:'客戶',age:35,sex:'M',marital:'single',job:1,kids:0,youngest:0,income:80,exp:4,debt:0,assets:0,budget:null,lifeHave:0,hasMed:false,hasCI:false,hasLTC:false,goals:['family','medical'],risk:'m',retire:65,svc:[],smart:'unknown'};
const CN = {'零':0,'〇':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
function cnToNum(s){ if (/^[0-9.]+$/.test(s)) return parseFloat(s); let t=0,c=0; for (const ch of s){ if (ch in CN) c=CN[ch]; else if (ch==='十'){t+=(c||1)*10;c=0;} else if (ch==='百'){t+=(c||1)*100;c=0;} else if (ch==='千'){t+=(c||1)*1000;c=0;} } return t+c; }
const N = '([0-9]+(?:\\.[0-9]+)?|[零〇一二兩两三四五六七八九十百千]+)';
const FILL = '(?:大概|大約|約|約為|差不多|是|有|為|在|還有|剩|剩下|左右)*';
function toWan(v,u){ if (u==='億') return v*10000; if (u==='千'||u==='千元') return v/10; if (u==='元'||u==='塊') return v/10000; if (!u && v>=10000) return v/10000; return v; }
function grab(t, heads, sum){ const re = new RegExp(`(?:${heads})${FILL}${N}(萬|億|千元|千|元|塊)?`,'g'); let m, vs=[]; while((m=re.exec(t))) vs.push(toWan(cnToNum(m[1]),m[2])); return vs.length ? (sum ? vs.reduce((a,b)=>a+b,0) : vs[0]) : null; }
function newO(){ return JSON.parse(JSON.stringify(DEFAULTS)); }

function parseZH(raw){
  const t = raw.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248)).replace(/\s+/g,'');
  const o = newO(), hit = new Set(), set=(k,v)=>{o[k]=v;hit.add(k);};
  const nm = t.match(/([一-龥]{1,2})(先生|小姐|太太|女士|董|總)/); if (nm && !/^(她|他|我|的|跟|和|與)/.test(nm[1])) set('name',nm[1]+nm[2]);
  if (/女性|女生|小姐|女士|太太|媽媽|她/.test(t)) set('sex','F'); else if (/男性|男生|先生|爸爸|他|董/.test(t)) set('sex','M');
  let childAges=[];
  for (const cl of t.split(/[，,。；;、\n]|然後|另外/).filter(Boolean)){
    const isChild=/小孩|孩子|子女|兒子|女兒|小朋友|寶寶|老大|老二/.test(cl), isRet=/退休/.test(cl);
    const ages=[...cl.matchAll(new RegExp(N+'(?:歲|足歲)','g'))].map(m=>cnToNum(m[1]));
    if (isRet){ if (ages.length) set('retire',clamp(ages[0],40,80)); else { const r=cl.match(/退休.*?([0-9]{2})/); if (r) set('retire',clamp(+r[1],40,80)); } continue; }
    if (isChild && ages.length){ childAges.push(...ages); continue; }
    if (!hit.has('age') && ages.length){ const a=ages.find(x=>x>=18&&x<=80); if (a) set('age',a); }
    if (!hit.has('age')){ const roc=cl.match(/([5-9][0-9])年次/); if (roc) set('age',clamp(115-(+roc[1]),18,80)); }
  }
  const kc = t.match(new RegExp(N+'(?:個|位|名)(?:小孩|孩子|子女|兒子|女兒|小朋友|寶寶)'));
  if (/一兒一女|一男一女/.test(t)) set('kids',2); else if (kc) set('kids',clamp(cnToNum(kc[1]),0,6)); else if (childAges.length) set('kids',childAges.length); else if (/(兒子|女兒|寶寶|獨生)/.test(t)) set('kids',1);
  if (/沒有(小孩|孩子|子女)|無子女|頂客|不生/.test(t)) set('kids',0);
  const yg = t.match(new RegExp('最小(?:的)?(?:小孩|孩子|兒子|女兒)?(?:才|是)?'+N+'歲'));
  if (yg) set('youngest',cnToNum(yg[1])); else if (childAges.length) set('youngest',Math.min(...childAges));
  if (/(小孩|孩子|子女)(都)?(已經)?(成年|大了|出社會|工作了)/.test(t)){ set('youngest',25); if (!hit.has('kids')) set('kids',2); }
  if (/離婚|喪偶|單親/.test(t)) set('marital','divorced'); else if (/已婚|結婚|新婚|老婆|老公|配偶|另一半|夫妻|雙薪/.test(t)) set('marital','married'); else if (/單身|未婚/.test(t)) set('marital','single'); else if (o.kids>0) set('marital','married');
  if (/高空|工地|營造|消防|警察|軍人|漁|礦|職業駕駛|貨車/.test(t)) set('job',3); else if (/外勤|業務|外送|送貨|跑客戶|司機|外務/.test(t)) set('job',2); else if (/內勤|上班族|工程師|公務員|老師|會計|行政|醫師|設計/.test(t)) set('job',1);
  let v;
  if ((v=grab(t,'年收入|年收|年薪|年所得|一年賺|一年收入'))!=null) set('income',v); else if ((v=grab(t,'月薪|月收入|月收|每月收入|一個月賺|每個月賺'))!=null) set('income',Math.round(v*13*10)/10);
  if ((v=grab(t,'(?:每月|一個月|每個月)(?:的)?(?:支出|開銷|花費|開支|生活費)|月(?:支出|開銷|花費|開支)|生活費(?:每月|一個月)?'))!=null) set('exp',v);
  if ((v=grab(t,'房貸|負債|貸款|車貸|信貸',true))!=null) set('debt',v);
  if ((v=grab(t,'存款|資產|存了|現金|積蓄|身價|可動用資金|閒錢'))!=null) set('assets',v);
  if ((v=grab(t,'預算|年繳|每年(?:可以|能|想)?(?:繳|存|放|投入)'))!=null) set('budget',Math.round(v*10)/10); else if ((v=grab(t,'(?:每月|一個月|每個月|月)(?:可以|能|想)?(?:繳|存|放|投入)|月繳'))!=null) set('budget',Math.round(v*12*10)/10);
  if ((v=grab(t,'(?:團保|壽險)(?:保額)?'))!=null) set('lifeHave',v);
  const own='(?:已經有|已有|有買|買過|有保|公司有)';
  if (new RegExp(own+'.{0,6}(?:實支|醫療)').test(t)) set('hasMed',true);
  if (new RegExp(own+'.{0,6}(?:癌症|重大傷病|重疾)').test(t)) set('hasCI',true);
  if (new RegExp(own+'.{0,6}(?:長照|失能)').test(t)) set('hasLTC',true);
  if (/沒有(任何)?保險|沒保險|都沒(有)?買|完全沒有保障/.test(t)){ set('hasMed',false); set('hasCI',false); set('hasLTC',false); set('lifeHave',0); }
  const g=[];
  if (/家庭|家人|保障老婆|保障老公|保障小孩|萬一|責任/.test(t)) g.push('family');
  if (/醫療|住院|開刀|手術|生病|癌症|重大傷病|長照|健康/.test(t)) g.push('medical');
  if (/退休|老後|養老|年金/.test(t)) g.push('retire');
  if (/教育|學費|留學|讀書基金/.test(t)) g.push('edu');
  if (/傳承|留給|遺產|稅|下一代|財富移轉/.test(t)) g.push('legacy');
  if (/儲蓄|存錢|強迫儲蓄|存一筆|理財/.test(t)) g.push('save');
  if (g.length){ if (o.kids>0||o.marital==='married') g.push('family'); set('goals',[...new Set(g)]); }
  if (/保守|保本|不想虧|不能虧|不要風險|怕風險|穩穩的/.test(t)) set('risk','c'); else if (/積極|衝一點|報酬高|高報酬|可以承受|能承受波動|投資型/.test(t)) set('risk','a'); else if (/穩健|中等|平衡/.test(t)) set('risk','m');

const EN_NUM = {a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6};
const CUR = '(?:NT\\$|NTD|TWD|US\\$|\\$)?\\s*';
const AMT = '([0-9][0-9,]*(?:\\.[0-9]+)?)\\s*(million|mil|mn|m|k|thousand|萬)?\\b';

  const childRe=/\b(kids?|child(?:ren)?|sons?|daughters?|bab(?:y|ies)|youngest)\b/i;
  let childAges=[];

    const nums=[...cl.matchAll(/\b(\d{1,2})\b(?!\s*(?:k|m|million|thousand|%|,\d))/gi)].map(m=>+m[1]);
    if (/retir/i.test(cl)){ const r=cl.match(/\b(\d{2})\b/); if (r && !/\$/.test(cl)) set('retire',clamp(+r[1],40,80)); continue; }

  if (/divorc|widow|single (parent|mother|father)/i.test(t)) set('marital','divorced'); else if (/\bmarried|newlywed|\bwife\b|\bhusband\b|spouse|dual.income/i.test(t)) set('marital','married'); else if (/\bsingle\b|unmarried/i.test(t)) set('marital','single'); else if (o.kids>0) set('marital','married');
  if (/construction|police|firefight|military|fisher|truck|professional driver/i.test(t)) set('job',3); else if (/\bfield\b|\bsales\b|outdoor|delivery|courier/i.test(t)) set('job',2); else if (/office|engineer|teacher|accountant|desk|civil servant|designer|doctor/i.test(t)) set('job',1);

  const own='(?:already (?:has|have)|has|have|owns?|holds?)\\s+(?:an?\\s+)?(?:[\\w-]+\\s+){0,3}?';
  if (new RegExp(own+'(?:medical|health|hospital)','i').test(t)) set('hasMed',true);

  const g=[];
  if (/protect (?:the |his |her |their )?family|family protection|dependants|dependents|provide for/i.test(t)) g.push('family');
  if (/medical|health|hospital|surgery|cancer|critical illness|long-term care/i.test(t)) g.push('medical');
  if (/retire|pension|old age/i.test(t)) g.push('retire');
  if (/education|tuition|college|university|school fees/i.test(t)) g.push('edu');
  if (/legacy|estate|inherit|next generation|wealth transfer/i.test(t)) g.push('legacy');
  if (/\bsav(?:e|ing) (?:money|regularly|up)|savings plan|build savings/i.test(t)) g.push('save');
  if (g.length){ if (o.kids>0||o.marital==='married') g.push('family'); set('goals',[...new Set(g)]); }
  if (/conservative|low risk|risk.averse|capital (?:protection|guaranteed)|can'?t lose/i.test(t)) set('risk','c'); else if (/aggressive|high risk|high return|tolerate (?:some )?volatility|growth-oriented|risk-tolerant/i.test(t)) set('risk','a'); else if (/balanced|moderate/i.test(t)) set('risk','m');

  else if (/\bLINE\b|check (?:the |their |his |her )?cover(?:age)? anytime|instant answers?|chatbot/i.test(t)) set('smart','yes');
  const s=[];
  if (/easy claims|claims? (?:to be )?(?:easy|simple|fast|quick|hassle)|hassle-free claim/i.test(t)) s.push('claims');
  if (/online (?:policy|access|service)|policy loans?/i.test(t)) s.push('portal');
  if (/concierge|dedicated|one-stop|private bank/i.test(t)) s.push('concierge');
  if (s.length) set('svc',s);
  return {o,hit};
}

/* ================= planning ================= */
function read(){
  return { name:$('name').value.trim()||(EN()?'Client':'客戶'), age:clamp(num('age',35),18,75), sex:radio('sex')||'M', marital:$('marital').value, job:+$('job').value,
    kids:clamp(num('kids'),0,6), youngest:clamp(num('youngest'),0,40), income:Math.max(0,num('income')), exp:Math.max(0,num('exp')),
    debt:Math.max(0,num('debt')), assets:Math.max(0,num('assets')), lifeHave:Math.max(0,num('lifeHave')), retire:clamp(num('retire',65),40,80),
    hasMed:$('hasMed').checked, hasCI:$('hasCI').checked, hasLTC:$('hasLTC').checked,
    goals:[...document.querySelectorAll('input[name="goal"]:checked')].map(x=>x.value),
    svc:[...document.querySelectorAll('input[name="svc"]:checked')].map(x=>x.value),
    smart:radio('smart')||'unknown', risk:radio('risk')||'m', rateA:clamp(num('rateA',2.25),0,6), rateD:clamp(num('rateD',3),0,8), budget:S.budget };
}
function plan(c){
  const a=c.age, sexF=c.sex==='F'?0.75:1, yrsToRet=c.retire-a, kidsDep=c.kids>0&&c.youngest<22, has=g=>c.goals.includes(g);
  const support = kidsDep ? clamp(22-c.youngest,5,20) : (c.marital==='married'?5:2);
  const edu = kidsDep ? c.kids*250*Math.max(0,22-c.youngest)/22 : 0;
  const lifeNeed = Math.max(0, r10(c.debt + c.exp*12*support*0.7 + edu + 50 - c.assets*0.3));
  const lifeGap = Math.max(0, lifeNeed-c.lifeHave), hasDependents = c.marital==='married'||kidsDep;
  const ciNeed=clamp(r10(c.income*2),100,300), accNeed=clamp(r10(c.income*5),300,1000), jobF=[1,1,1.6,2.5][c.job];
  const termRate=0.12*Math.exp(0.075*(a-25))*sexF;
  const prem={life:g=>g/100*termRate, med:()=>0.8*Math.exp(0.042*(a-25)), ci:g=>g/100*0.28*Math.exp(0.058*(a-25)), acc:g=>g/100*0.11*jobF+0.15*jobF, ltc:()=>1.0*Math.exp(0.045*(a-25))};
  const saveGoals=['retire','edu','legacy','save'].filter(has).length;
  const pct=Math.min(0.10+saveGoals*0.03+(c.assets>c.income*10?0.05:0),0.25), suggested=Math.round(c.income*pct*2)/2;
  const budget = c.budget!=null ? c.budget : suggested;
  const items=[];
  if (lifeGap>0) items.push({key:'life',pr:hasDependents?1:3,cover:lifeGap,available:a<=64});
  if (!c.hasMed) items.push({key:'med',pr:has('medical')?1:2,cover:30});
  if (!c.hasCI) items.push({key:'ci',pr:1,cover:ciNeed});
  items.push({key:'acc',pr:c.job>=2?1:2,cover:accNeed});
  if (!c.hasLTC) items.push({key:'ltc',pr:a>=45?1:2,cover:3,monthly:true});
  items.forEach(i=>{ i.premium = i.available===false?0:prem[i.key](i.cover); i.status='in'; });
  const order=['med','ci','life','acc','ltc'];
  items.sort((x,y)=>x.pr-y.pr||order.indexOf(x.key)-order.indexOf(y.key));
  let left=budget, shortfall=false;
  for (const i of items){
    if (i.available===false){ i.status='na'; continue; }
    if (S.off.has(i.key)){ i.status='off'; continue; }
    if (i.premium<=left+1e-9){ left-=i.premium; continue; }
    if (i.key==='life' && left>0){ const aff=Math.floor(left/termRate*100/50)*50; if (aff>=100){ i.cover=aff; i.premium=prem.life(aff); left-=i.premium; i.status='partial'; shortfall=true; continue; } }
    i.status='deferred'; shortfall=true;
  }
  const spent=items.filter(i=>i.status==='in'||i.status==='partial').reduce((s,i)=>s+i.premium,0);
  let Sv=Math.max(0,budget-spent), reserve=0;
  if (saveGoals===0){ reserve=Sv*0.5; Sv-=reserve; }
  const w={...({c:{ann:.7,div:.3,inv:0},m:{ann:.45,div:.45,inv:.10},a:{ann:.25,div:.40,inv:.35}}[c.risk])};
  if (has('retire')) w.ann+=.15; if (has('legacy')) w.div+=.25; if (has('edu')){w.ann+=.05;w.div+=.05;} if (has('save')){w.ann+=.05;w.div+=.05;}
  if (a>=60||c.risk==='c') w.inv=0;
  ['ann','div','inv'].forEach(k=>{ if (S.off.has(k)) w[k]=0; });
  const tw=w.ann+w.div+w.inv;
  let sav = tw>0 ? {ann:Sv*w.ann/tw, div:Sv*w.div/tw, inv:Sv*w.inv/tw} : {ann:0,div:0,inv:0};
  if (tw===0) reserve+=Sv;
  for (const k of ['inv','div','ann']) if (sav[k]>0 && sav[k]<3 && Sv>=3){ const tg=Object.keys(sav).filter(x=>x!==k&&w[x]>0).sort((p,q)=>sav[q]-sav[p])[0]; if (tg){ sav[tg]+=sav[k]; sav[k]=0; } }
  if (Sv<3 && tw>0){ reserve+=Sv; sav={ann:0,div:0,inv:0}; }
  const savKeys = ['ann','div','inv'].filter(k=> sav[k]>0 || S.off.has(k));
  const payY = yrsToRet>0?clamp(yrsToRet,6,20):6, H = yrsToRet>0?Math.max(yrsToRet,payY):15;
  const sc={low:{ann:c.rateA-.5,div:c.rateD-1,inv:1},mid:{ann:c.rateA,div:c.rateD,inv:4.5},high:{ann:c.rateA+.25,div:c.rateD+1,inv:7}};
  const val={low:{ann:0,div:0,inv:0},mid:{ann:0,div:0,inv:0},high:{ann:0,div:0,inv:0}}, proj=[{t:0,age:a,low:0,mid:0,high:0,paid:0}]; let paid=0;
  for (let t=1;t<=H;t++){ const on=t<=payY; if (on) paid+=sav.ann+sav.div+sav.inv; const row={t,age:a+t,paid};
    for (const s of ['low','mid','high']){ let sum=0; for (const k of ['ann','div','inv']){ val[s][k]=(val[s][k]+(on?sav[k]:0))*(1+Math.max(0,sc[s][k])/100); sum+=val[s][k]; } row[s]=sum; } proj.push(row); }
  const retNeed = yrsToRet>0 ? c.exp*0.7*12*20*Math.pow(1.02,yrsToRet) : 0;
  const atRet = yrsToRet>0 ? proj[Math.min(yrsToRet,H)] : proj[proj.length-1];
  const alloc=[]; items.filter(i=>i.status==='in'||i.status==='partial').forEach(i=>alloc.push({key:i.key,amt:i.premium}));
  ['ann','div','inv'].forEach(k=>{ if (sav[k]>0) alloc.push({key:k,amt:sav[k]}); }); if (reserve>0.05) alloc.push({key:'reserve',amt:reserve});
  const total=alloc.filter(x=>x.key!=='reserve').reduce((s,x)=>s+x.amt,0);
  return {c,lifeNeed,lifeGap,support,edu,ciNeed,accNeed,items,sav,savKeys,reserve,budget,suggested,pct,total,shortfall,proj,payY,H,retNeed,atRet,yrsToRet,alloc,hasDependents,readiness:retNeed>0?atRet.mid/retNeed:null};
}

  S.lang = l; applyStatic();
  $('story').value = STORIES[l].family; S.preset='family';
  parseAndApply(false);
})();

</script>
